name: verify-windows
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --all-targets --all-features --no-fail-fast
        env:
          RUST_BACKTRACE: "1"
